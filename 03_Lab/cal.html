<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shridhar Calculator</title>
</head>
    <script src="cal.js"></script>
    <link rel="stylesheet" href="cal.css">
    <link rel="stylesheet" href="style.css">
<body>
    <div id ="container">
    <h1>Shree's Calculator</h1>
    <input type="text" id="inputData" placeholder="Enter the Numbers">
    
    <div class="num">
        <button onclick="btn7()" class="n">7</button>
        <button onclick="btn8()" class="n">8</button>
        <button onclick="btn9()" class="n">9</button>
        <button onclick="add()" class="add">+</button>
    </div>
    <div class="num">
        <button onclick="btn4()" class="n">4</button>
        <button onclick="btn5()" class="n">5</button>
        <button onclick="btn6()" class="n">6</button>
        <button onclick="sub()" class="sub">-</button>
    </div>
    <div class="num">
        <button onclick="btn1()" class="n">1</button>
        <button onclick="btn2()" class="n">2</button>
        <button onclick="btn3()" class="n">3</button>
        <button onclick="equal()" class="equal">=</button>
    </div>
    <div class="num">
        <button onclick="btn0()" class="n">0</button>
        <button onclick="btn00()" class="n">00</button>
        <button onclick="Clear()" class="n">C</button>
    </div>
    </div>
</body>
</html>
